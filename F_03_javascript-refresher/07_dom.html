<button id="themeBtn">Switch Coffee Shop Theme</button>
  <p id="promoMessage">New promo will be revealed in 2 seconds.</p>

  <script>
    const button = document.getElementById("themeBtn");
    button.addEventListener("click", () => {
      const color = prompt("What theme color do you prefer for the POS?");
      document.body.style.backgroundColor = color;
    });

    const message = document.getElementById("promoMessage");
    setTimeout(() => {
      message.textContent = "Flash Sale: 50% off on all Pastries!";
    }, 2000);
  </script>
